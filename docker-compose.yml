version: "3.8"

services:
    app:
        build: .
        container_name: laravel_reservation
        working_dir: /var/www
        volumes:
            - .:/var/www
            - /var/www/node_modules
        ports:
            - "5173:5173"
        networks:
            - docker_default

    nginx:
        image: nginx:latest
        container_name: reservation_nginx
        ports:
            - "8000:80"
        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - docker_default

networks:
    docker_default:
        external: true
